[project]
name = "second-brain-rag"
version = "0.1.0"
description = "Local-first agentic RAG second brain over the owner's university corpus (CLI: sbr)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ammar Sayyadi" }]
dependencies = [
    "blake3>=1.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.12",
    "xxhash>=3.5",
]

[project.scripts]
sbr = "sbr.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbr"]

[tool.uv]
python-preference = "managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: long-running tests (large files, subprocess kills)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "tools"]
extend-exclude = ["audit", ".venv-audit"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "S", "BLE", "TRY", "N"]
ignore = [
    "TRY003",  # long messages in exception constructors are intentional (explicit errors)
    "RUF001", "RUF002", "RUF003",  # German text and typographic dashes are legitimate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "PTH"]
"tools/**" = ["S", "PTH", "BLE", "E731", "N"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["sbr"]
strict = true
warn_unreachable = true
