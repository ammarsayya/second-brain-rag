# Pre-commit hooks (T-P1-01). Historical audit evidence and handoff reports are never rewritten by hooks.
exclude: ^(audit/|\.venv-audit/|CODEX_AUDIT_HANDOFF.*\.md$)
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(docs/.*\.json|uv\.lock)$
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python -m uv run --frozen ruff check
        language: system
        types: [python]
        files: ^(src|tests)/
      - id: ruff-format
        name: ruff format --check
        entry: python -m uv run --frozen ruff format --check
        language: system
        types: [python]
        files: ^(src|tests)/
      - id: mypy
        name: mypy (strict, src/sbr)
        entry: python -m uv run --frozen mypy
        language: system
        pass_filenames: false
        files: ^src/
      - id: validate-plan
        name: plan consistency
        entry: python -m uv run --frozen python tools/validate_plan.py
        language: system
        pass_filenames: false
        files: ^docs/
