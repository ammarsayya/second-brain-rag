# Curation ledger: course id -> owner-known folder abbreviations and matching patterns (ADR-029; git-tracked).
# Seeded for T-P2-11 from the two authoritative taxonomy seeds at the corpus root (docs/12 §"Seeds", docs/03):
#   D:\MBI-BRAIN\curriculum_mbi_ws2019.pdf        - official module/submodule list, PO WS2019 (course_id, name)
#   D:\MBI-BRAIN\MBI-WS2019-Modulhandbuch.pdf     - per-module descriptions (used to resolve abbreviations, e.g.
#                                                    "MSR" = Messen-Steuern-Regeln, "SAB" = Sensor-Aktor-Bus-Technik)
# course_id is the official M-Kürzel (MBI-nnn) from the curriculum, or the more specific TM-Kürzel (MAB-nnn-nn /
# MBI-nnn-nn) where the real corpus folder structure distinguishes a submodule the parent module code would blur
# (e.g. Betriebslehre's "Betg" vs "RechtK" subfolders -> two different MAB-114-* submodules, not one MBI-112 lump).
#
# Matching (src/sbr/registry/courses.py): `aliases` are single folder-segment tokens (matched case-insensitively
# against one entry of PathObservation.folder_tokens); `folder_patterns` are ordered multi-segment token sequences
# (backslash-separated, matched as a contiguous run within folder_tokens) used to disambiguate a short/reused token
# by its parent folder, or to give one course a broad default over an entire subtree. Whichever matcher's LAST
# token lands deepest in a file's folder_tokens wins (so a specific nested pattern like "BachelorArbeit\Praxisphase"
# overrides the broader "BachelorArbeit" default for files under it); a longer matcher wins ties over a shorter one.
# Folder segments this file does not mention at all resolve to course_id=None ("unknown") automatically - that is
# the acceptance criterion's "marked unknown", not a gap to silently ignore. tools/validate_courses.py reports
# every level-3 folder's resolution (mapped course_id, or unknown) against the real corpus for owner review.
# `domains` links each course to one or more concept_id values in taxonomy.yaml. It is organizational metadata only:
# course matching still uses only aliases/folder_patterns, and the taxonomy draft remains owner-review-gated.
