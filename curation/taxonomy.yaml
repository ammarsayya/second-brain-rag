# Curation ledger: bilingual, poly-hierarchical taxonomy (ADR-029, docs/12 §1; git-tracked, authoritative).
# Drafted for T-P5-06 from the 42 curriculum/module-handbook-derived courses in course_map.yaml. This file contains
# organizational metadata only, not source-corpus content. The owner remains authoritative: these concepts, labels,
# edges, and all course-to-domain assignments require owner review before Taxonomy v0 can be approved.
# broader/narrower and related links are recorded reciprocally; poly-hierarchy is intentional where a subject spans
# established disciplines (FEM, simulation, robotics, and sensor/actuator/bus systems).
